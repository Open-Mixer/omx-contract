name: ci

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Every dispatch has a group of its own (the run id) and is never cancelled.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The packages run only on workflow_dispatch: a pull request or a push runs the tests alone. release.yml builds staged on a
  # dispatch and promotes that build on a v* tag; fast-release dispatches this workflow on a release head. The private copy runs on its own runners, as test does.
  # no Fedora release written into a job: the cells come from check-matrix (rule 11-10, ruling D25)
  fedora-cells:
    runs-on: ${{ github.event.repository.private && 'arc-freemixer' || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/workflows
      - uses: Open-Mixer/.github/.github/actions/fedora-cells@openmixer-v1

  # the dependency floors: the spec, debian/control and the workflow install lines state floors only, no ceiling
  # (Open-Mixer/.github's deps-render, at the same openmixer-v1 ref every shared action of this repository uses)
  deps-render:
    name: the packaging states floors only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: Open-Mixer/.github/.github/actions/deps-render@openmixer-v1

  # every consumer's use of the install interface (the installer's arguments, the rpm macros, the pkg-config variables),
  # read at its devel head (tools/consumers.txt) and held to this head: the drift THIS change makes is red, each finding
  # naming the consumer, the file and the line (#262: 0.23 dropped the installer's schema-major argument and nine
  # consumers still passed it). A consumer already behind devel is counted on the last line, never judged here.
  consumer-drift:
    name: no consumer's install interface breaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      # lib/ (the entry point's isMain) is built, as every tool here reads it
      - run: |
          npm ci --no-audit --no-fund
          npm run build
          node tools/consumer-drift.mjs --base origin/devel

  # the cells the import and package jobs run: check-matrix's answer (Fedora 45 alone; the quick set while a release wave
  # is open, the whole matrix declared here otherwise)
  checks:
    runs-on: ${{ github.event.repository.private && 'arc-freemixer' || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      rpm: ${{ steps.m.outputs.rpm }}
      rpm-count: ${{ steps.m.outputs.rpm-count }}
      cells: ${{ steps.m.outputs.cells }}
      count: ${{ steps.m.outputs.count }}
    steps:
      - id: m
        uses: Open-Mixer/.github/.github/actions/check-matrix@openmixer-v1
        with:
          wave: ${{ vars.OMX_RELEASE_MATRIX }}
          rpm-releases: '["45"]'
          rpm-arches: '["x86_64"]'
          deb-releases: '["trixie"]'
          deb-arches: '["amd64"]'

  changes:
    name: what the pull request changes
    runs-on: ${{ github.event.repository.private && 'arc-freemixer' || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      packages: ${{ steps.diff.outputs.packages }}
    steps:
      # Packaging runs only on workflow_dispatch (the release dry run fast-release dispatches on a release head);
      # a pull request or a push runs the tests alone. release.yml builds staged on a dispatch, a v* tag promotes it.
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then echo "packages=true"; else echo "packages=false"; fi >> "$GITHUB_OUTPUT"

  test:
    # the private development copy runs on OpenMixer's own runners (hosted runners are refused there); the public
    # repository runs on GitHub's
    runs-on: ${{ github.event.repository.private && 'arc-freemixer' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - id: handback-install
        name: Install the one runtime dependency, and the two pinned shape generators (docs/shapes.md)
        run: |
          npm ci
          python3 -m pip install --user -r tools/shapes-requirements.txt -c tools/shapes-constraints.txt
      - id: handback-validate
        name: The data is valid and in the one formatting
        run: |
          node bin/omx-contract.mjs validate
          node bin/omx-contract.mjs fmt --check
      - id: handback-contract-dir
        name: The data installed as the contract directory renders the same bytes, and its links hold
        run: |
          make install DESTDIR="$RUNNER_TEMP/inst" PREFIX=/usr DATADIR=/usr/share INCLUDEDIR=/usr/include
          dir="$RUNNER_TEMP/inst/usr/share/omx-contract/contract.d"
          node bin/omx-contract.mjs validate --contract-dir "$dir"
          node bin/omx-contract.mjs fmt --check --contract-dir "$dir"
          node bin/omx-contract.mjs render --target c --out include --check --contract-dir "$dir"
          node bin/omx-contract.mjs render --target json --out share/omx-contract --check --contract-dir "$dir"
          node bin/omx-contract.mjs render --target lv2 --out share/omx-contract --check --contract-dir "$dir"
          node bin/omx-contract.mjs render --target ts --out test/golden/ts --check --contract-dir "$dir"
          node bin/omx-contract.mjs links --check
      - id: handback-verbs
        name: A package's verbs, installed beside the data, validate and render the committed fixture headers
        run: |
          vdir="$RUNNER_TEMP/verbs"
          cp -r "$RUNNER_TEMP/inst/usr/share/omx-contract/contract.d" "$vdir"
          # the hosts the verbs name (V29): omx-clap's hosting/verb-hosts.json, as a fixture, never omx-clap itself
          sh tools/install-contract-dir.sh omx-clap 0.34.0 test/fixtures/hosting-verb-hosts "$vdir" data
          sh tools/install-contract-dir.sh verbs-fixture 1.0.0 test/fixtures/package-verbs "$vdir" data
          node bin/omx-contract.mjs validate --contract-dir "$vdir"
          node bin/omx-contract.mjs fmt --check --contract-dir "$vdir"
          node bin/omx-contract.mjs render --target c --package verbs-fixture --contract-dir "$vdir" --out test/golden/verbs/c --check
          node bin/omx-contract.mjs render --target c --contract-dir "$vdir" --out "$RUNNER_TEMP/verbs-c"
          cmp "$RUNNER_TEMP/verbs-c/omxcontract/omx_host_verbs.h" test/golden/verbs/omx_host_verbs.h
      - id: handback-installed-cli
        name: The installed omx-contract command, with its vendored dependencies only, reads the installed directory
        run: |
          make install-cli DESTDIR="$RUNNER_TEMP/inst" PREFIX=/usr DATADIR=/usr/share
          cli="$RUNNER_TEMP/inst/usr/lib/omx-contract/bin/omx-contract.mjs"
          dir="$RUNNER_TEMP/inst/usr/share/omx-contract/contract.d"
          cd "$RUNNER_TEMP"
          node "$cli" validate --contract-dir "$dir"
          node "$cli" render --target json --out "$RUNNER_TEMP/cli-json" --contract-dir "$dir"
          cmp "$RUNNER_TEMP/cli-json/omx-contract.json" "$GITHUB_WORKSPACE/share/omx-contract/omx-contract.json"
      - id: handback-test
        name: Tests (schema, semantic checks, goldens, perturbation, semver, round trip)
        run: npm test
      - id: handback-semver
        name: What this change is to a consumer (semver against the last tag, the schema included); the release holds the bump to it
        run: |
          git fetch --tags --force origin
          # the previous release of package.json's major (tools/previous-tag.sh, as release.yml reads it): a tag of
          # another major is never compared, and the first release of a major has nothing to compare with
          version=$(node -p 'require("./package.json").version')
          tag=$(sh tools/previous-tag.sh "$version") || exit 1
          if [ -z "$tag" ]; then
            echo "first release of v${version%%.*}: no previous tag of its major" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node bin/omx-contract.mjs semver "$tag" --report | tee "$RUNNER_TEMP/semver.txt"
          { echo "### Changes since $tag"; echo '```'; cat "$RUNNER_TEMP/semver.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # the schema's version moves with the schema, in the change, since consumers' floors are read against it
          node bin/omx-contract.mjs semver "$tag" --schema-version
      - id: handback-layout
        name: Every word in the file its rule places it; every installed LV2 and CLAP term mapped with a status
        run: make layout
      - id: handback-ownership
        name: Every item of data/ is owned here or moving out, and the moving-out list only shrinks (omx-contract#81)
        run: |
          make ownership
          node --test test/ownership.test.mjs
      - name: Install the C toolchain where the runner has none (arc-freemixer's image carries no make or cc)
        run: |
          command -v make >/dev/null && command -v cc >/dev/null || {
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends make gcc libc6-dev
          }
      - id: handback-headers
        name: The headers compile with no node (what a release build runs)
        run: make check
      - name: Install jansson where the runner has none (the C domain loader's JSON library)
        run: pkg-config --exists jansson || { sudo apt-get update -qq; sudo apt-get install -y --no-install-recommends libjansson-dev pkg-config; }
      - id: handback-c-loader
        name: The C domain loader, under the sanitizers, its ABI list held, and the installed command refusing with 78
        run: |
          make test-c
          make install-c DESTDIR="$RUNNER_TEMP/inst-c" PREFIX=/usr CONTRACTDIR=/usr/share/omx-contract/contract.d
          export LD_LIBRARY_PATH="$RUNNER_TEMP/inst-c/usr/lib"
          rc=0
          "$RUNNER_TEMP/inst-c/usr/bin/omx-domain" no-such-domain || rc=$?
          test "$rc" -eq 78
      - # npm test ran before the C runner existed, so its C-against-TypeScript comparison skipped there: here it runs
        name: The C loader and openDomainAt give one verdict per conformance case (the comparison, never skipped)
        run: OMX_CONFORMANCE_C=required node --test test/domain-conformance.test.mjs
      - name: Install doxygen where the runner has none
        run: command -v doxygen >/dev/null || { sudo apt-get update -qq; sudo apt-get install -y --no-install-recommends doxygen; }
      - id: handback-doxygen
        name: Every public declaration of the installed headers documented, the baseline held to main's and only shrinking
        run: |
          git fetch --no-tags origin main
          make doxygen-check DOXYGEN_BASE=origin/main
      - id: handback-doxygen-gate
        name: The documentation gate is red on an undocumented new declaration, a stale baseline line and a grown baseline
        run: node --test test/doxygen-gate.test.mjs

  # The C domain loader on each Fedora cell of check-matrix (fc45 among them), not only on the ubuntu runner of the test
  # job: make test-c under the sanitizers with that release's gcc and glibc, the installed command refusing with 78,
  # and the C-against-TypeScript conformance comparison. The catalog-change test of domain_test failed on fedora:45
  # while the ubuntu step sat skipped behind an unrelated red (omx-contract#177).
  c-loader-fedora:
    name: C loader (fc${{ matrix.cell.fedora }}), sanitizers, ABI, conformance
    needs: checks
    if: needs.checks.outputs.rpm-count != '0'
    runs-on: ${{ github.event.repository.private && 'arc-freemixer' || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(needs.checks.outputs.rpm) }}
    container:
      image: ${{ matrix.cell.image }}
    steps:
      - name: Install the C toolchain, the sanitizer runtimes, jansson and node
        run: |
          dnf install -y --setopt=install_weak_deps=False --setopt=retries=5 git make gcc binutils jansson-devel \
            pkgconf-pkg-config libasan libubsan diffutils findutils nodejs npm
      - uses: actions/checkout@v4
      - name: Install the node dependencies (the conformance comparison reads the built library)
        run: npm ci --no-audit --no-fund
      - id: handback-c-loader-fedora
        name: The C domain loader, under the sanitizers, its ABI list held, and the installed command refusing with 78
        run: |
          set -eu
          make test-c
          make install-c DESTDIR="$RUNNER_TEMP/inst-c" PREFIX=/usr CONTRACTDIR=/usr/share/omx-contract/contract.d
          rc=0
          LD_LIBRARY_PATH="$RUNNER_TEMP/inst-c/usr/lib" "$RUNNER_TEMP/inst-c/usr/bin/omx-domain" no-such-domain || rc=$?
          test "$rc" -eq 78
      - id: handback-conformance-c-fedora
        name: The C loader and openDomainAt give one verdict per conformance case (the comparison, never skipped)
        run: OMX_CONFORMANCE_C=required node --test test/domain-conformance.test.mjs

  # The Python package from a clean container (omx-contract#28): the interpreter and make alone, omx_contract installed
  # where that interpreter looks, imported from / in isolated mode so the checkout cannot supply it. The packaging
  # jobs below repeat it on the built python3-omx-contract.
  python-import:
    name: import omx_contract (${{ matrix.cell.image }}), clean container
    needs: checks
    if: needs.checks.outputs.count != '0'
    runs-on: ${{ github.event.repository.private && 'arc-freemixer' || 'ubuntu-latest' }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(needs.checks.outputs.cells) }}
    container:
      image: ${{ matrix.cell.image }}
    steps:
      - name: Install python3 and make, nothing else
        run: |
          if command -v dnf >/dev/null; then dnf install -y --setopt=install_weak_deps=False python3 make
          else apt-get update -qq && apt-get install -y --no-install-recommends python3 make; fi
      - uses: actions/checkout@v4
      - id: handback-python-import
        name: make install-python for /usr, then import omx_contract.catalog, .scale and .clap
        run: |
          make install-python PREFIX=/usr
          sh tools/python-import-check.sh

  # The packages of a release, built as the release builds them (Open-Mixer/.github's build-rpm and build-deb actions),
  # each file held to the package it belongs in (tools/package-files.sh, BUILDING.md), and the command run on the
  # installed data with no development package.
  rpm:
    name: RPMs (fc${{ matrix.cell.fedora }}), which file lands in which package
    needs: [checks, changes]
    if: needs.changes.outputs.packages == 'true' && needs.checks.outputs.rpm-count != '0'
    runs-on: ${{ github.event.repository.private && 'arc-freemixer' || github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.OMX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(needs.checks.outputs.rpm) }}
    container:
      image: ${{ matrix.cell.image }}
    steps:
      - name: Install the build tools
        run: dnf install -y --setopt=install_weak_deps=False git rpm-build dnf5-plugins python3 cpio
      - uses: actions/checkout@v4
      - uses: Open-Mixer/.github/.github/actions/build-rpm@openmixer-v1
      - id: handback-rpm-files
        name: Which file lands in which package
        run: sh tools/package-files.sh rpm rpms
      - id: handback-rpm-runtime
        name: The command reads the installed contract directory with omx-contract-data and no development package
        run: |
          set -eu
          # a mirror that fails in mid-transfer (curl 56, zchunk checksums) is tried again; a real install error fails the
          # third attempt with its own output on the log
          dnf_retry() {
            local n
            for n in 1 2 3; do
              dnf install -y --setopt=retries=5 "$@" && return 0
              [ "$n" -lt 3 ] && { echo "::warning::dnf install failed, attempt $n of 3"; sleep 15; }
            done
            return 1
          }
          dnf_retry --setopt=install_weak_deps=False rpms/omx-contract-[0-9]*."$(uname -m)".rpm rpms/omx-contract-data-[0-9]*.noarch.rpm
          if rpm -q omx-contract-devel; then echo '::error::the development package came along'; exit 1; fi
          omx-contract validate --contract-dir /usr/share/omx-contract/contract.d
          omx-contract render --target json --contract-dir /usr/share/omx-contract/contract.d --out /tmp/json
          cmp /tmp/json/omx-contract.json /usr/share/omx-contract/omx-contract.json
          # the installed command finds the language list where omx-contract-data installs it, never in its own tree
          omx-contract translate --check --owner "$PWD"
      - id: handback-rpm-python
        name: python3-omx-contract alone imports omx_contract, outside the checkout
        run: |
          set -eu
          dnf install -y --setopt=install_weak_deps=False --setopt=retries=5 rpms/python3-omx-contract-[0-9]*.noarch.rpm
          sh tools/python-import-check.sh
      - id: handback-rpm-c-loader
        name: libomx-domain and its development package build a consumer, export the ABI list, refuse with 78
        run: |
          set -eu
          dnf install -y --setopt=install_weak_deps=False --setopt=retries=5 gcc binutils pkgconf-pkg-config \
            rpms/libomx-domain-[0-9]*."$(uname -m)".rpm rpms/libomx-domain-devel-[0-9]*."$(uname -m)".rpm
          sh tools/c-loader-check.sh

  deb:
    name: DEBs (${{ matrix.suite }}), linted, which file lands in which package
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    runs-on: ${{ github.event.repository.private && 'arc-freemixer' || github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.OMX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Debian is trixie only (owner ruling 2026-11-28)
        suite: ["trixie"]
    defaults:
      run:
        shell: bash
    container:
      image: debian:${{ matrix.suite }}
    steps:
      - name: Install the build tools
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates git dpkg-dev debhelper build-essential lintian python3
      - uses: actions/checkout@v4
      - uses: Open-Mixer/.github/.github/actions/build-deb@openmixer-v1
      - id: handback-deb-files
        name: Which file lands in which package
        run: sh tools/package-files.sh deb debs
      - id: handback-deb-runtime
        name: The command reads the installed contract directory with omx-contract-data and no development package
        run: |
          set -eu
          apt-get install -y --no-install-recommends ./debs/omx-contract_*_all.deb ./debs/omx-contract-data_*_all.deb
          if dpkg -s libomx-contract-dev; then echo '::error::the development package came along'; exit 1; fi
          omx-contract validate --contract-dir /usr/share/omx-contract/contract.d
          omx-contract render --target json --contract-dir /usr/share/omx-contract/contract.d --out /tmp/json
          cmp /tmp/json/omx-contract.json /usr/share/omx-contract/omx-contract.json
          # the installed command finds the language list where omx-contract-data installs it, never in its own tree
          omx-contract translate --check --owner "$PWD"
      - id: handback-deb-python
        name: python3-omx-contract alone imports omx_contract, outside the checkout
        run: |
          set -eu
          apt-get install -y --no-install-recommends ./debs/python3-omx-contract_*_all.deb
          sh tools/python-import-check.sh
      - id: handback-deb-c-loader
        name: libomx-domain0 and libomx-domain-dev build a consumer, export the ABI list, refuse with 78
        run: |
          set -eu
          apt-get install -y --no-install-recommends gcc libc6-dev binutils pkgconf ./debs/libomx-domain0_*_"$(dpkg --print-architecture)".deb ./debs/libomx-domain-dev_*_"$(dpkg --print-architecture)".deb
          sh tools/c-loader-check.sh
